<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="ConceptLens - Local, privacy-first study assistant that extracts key concepts, definitions, and relationships from course notes without external AI." />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#A8D5C2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ConceptLens" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <title>ConceptLens — Note Concept & Knowledge Graph Assistant</title>
    
    <!-- Google Fonts: Inter (headings), Rubik Dirt (wordmark), JetBrains Mono (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Rubik+Dirt&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="app-pre-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#F7F8F5;font-family:system-ui,-apple-system,sans-serif;user-select:none;z-index:9999;">
        <style>
          @media (prefers-color-scheme: dark) {
            #app-pre-loader { background: #17211C !important; color: #E2E8F0 !important; }
            #app-pre-loader .pre-sheet { background: #202D26 !important; border-color: rgba(255, 255, 255, 0.12) !important; }
            #app-pre-loader .pre-line { background: rgba(255, 255, 255, 0.25) !important; }
            #app-pre-loader .pre-label { color: #F1F5F9 !important; }
          }
          @keyframes preLensSweep {
            0% { transform: translate(32px, 38px) scale(0.95); }
            20% { transform: translate(50px, 38px) scale(1.08); }
            45% { transform: translate(110px, 38px) scale(1.08); }
            70% { transform: translate(170px, 38px) scale(1.08); }
            90% { transform: translate(188px, 38px) scale(0.95); }
            100% { transform: translate(32px, 38px) scale(0.95); }
          }
          @media (prefers-reduced-motion: reduce) {
            .pre-lens-group { animation: none !important; transform: translate(110px, 38px) !important; opacity: 0.9; }
          }
          .pre-lens-group {
            animation: preLensSweep 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            transform-origin: center;
          }
        </style>
        <svg width="220" height="76" viewBox="0 0 220 76" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <line x1="20" y1="50" x2="200" y2="50" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />
          <rect x="25" y="15" width="36" height="46" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4" class="pre-sheet" />
          <rect x="29" y="19" width="13" height="7" rx="1.5" fill="#397F69" />
          <text x="31" y="24.5" fill="#FFFFFF" font-size="4.8" font-weight="bold" font-family="system-ui">PDF</text>
          <line x1="30" y1="31" x2="55" y2="31" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" class="pre-line" />
          <line x1="30" y1="37" x2="51" y2="37" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" class="pre-line" />
          <line x1="30" y1="43" x2="54" y2="43" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" class="pre-line" />
          <line x1="30" y1="49" x2="44" y2="49" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" class="pre-line" />
          <rect x="90" y="17" width="40" height="42" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4" class="pre-sheet" />
          <circle cx="101" cy="27" r="3.5" fill="#397F69" opacity="0.85" />
          <path d="M94 47 L104 34 L111 42 L118 35 L126 47 Z" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.2" />
          <rect x="155" y="15" width="36" height="46" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4" class="pre-sheet" />
          <line x1="161" y1="22" x2="173" y2="22" stroke="#316F5B" stroke-width="1.8" stroke-linecap="round" />
          <line x1="161" y1="29" x2="185" y2="29" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" class="pre-line" />
          <line x1="161" y1="35" x2="182" y2="35" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" class="pre-line" />
          <line x1="161" y1="41" x2="184" y2="41" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" class="pre-line" />
          <line x1="161" y1="47" x2="175" y2="47" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" class="pre-line" />
          <g class="pre-lens-group">
            <path d="M7 7 L16 16" stroke="#316F5B" stroke-width="3" stroke-linecap="round" />
            <circle cx="16" cy="16" r="1.5" fill="#316F5B" />
            <circle cx="0" cy="0" r="12" stroke="#A8D5C2" stroke-width="2.5" fill="rgba(168, 213, 194, 0.2)" />
            <path d="M-8.5 -1.5 A 8.5 8.5 0 0 1 -1.5 -8.5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.9" />
          </g>
        </svg>
        <span class="pre-label" style="font-size:0.92rem;font-weight:500;color:#252D2A;letter-spacing:0.02em;">Loading ConceptLens...</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
