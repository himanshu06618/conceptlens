<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>#13 Bookshelf Loader</title>
  <!-- Google Font Montserrat for the optional blueprint caption -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       BOOKSHELF DOMINO LOADER
       Pure CSS + SVG Line-Art Animation
       Visual Style: Blueprint minimal line-art (#FFFFFF on solid #1C6AC6)
       ========================================================================== */

    :root {
      /* Single sizing variable for easy scaling */
      --loader-size: 340px;
      --bg-color: #1C6AC6;
      --stroke-color: #FFFFFF;
      --stroke-width: 3px;
      --cycle-duration: 3s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--stroke-color);
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Main responsive container */
    .loader-stage {
      width: var(--loader-size);
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* The primary SVG scene */
    .bookshelf-svg {
      width: 100%;
      height: auto;
      overflow: visible;
      display: block;
    }

    /* SVG Stroke styling: crisp unfilled rounded lines */
    .blueprint-stroke {
      fill: none;
      stroke: var(--stroke-color);
      stroke-width: var(--stroke-width);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .shelf-line {
      stroke: var(--stroke-color);
      stroke-width: var(--stroke-width);
      stroke-linecap: round;
    }

    .shelf-dots {
      stroke: var(--stroke-color);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-dasharray: 2px 7px;
      stroke-opacity: 0.4;
    }

    /* Spine detail inner strokes */
    .spine-detail {
      fill: none;
      stroke: var(--stroke-color);
      stroke-width: 2.2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ==========================================================================
       DOMINO TOPPLING ANIMATION ENGINE
       Each book rotates around its bottom-left corner (0px, 100px relative to book)
       and shifts smoothly leftwards so the domino wave loops continuously.
       ========================================================================== */

    .book {
      /* Transform around bottom-left corner of the 28x100 book rectangle */
      transform-origin: 0px 100px;
      animation-duration: var(--cycle-duration);
      animation-iteration-count: infinite;
      animation-timing-function: cubic-bezier(0.4, 0.0, 0.2, 1);
      will-change: transform, opacity;
    }

    /* 
      BOOK 0 (Leftmost): 
      Starts already tilted at -65deg.
      Tips over flat onto the shelf (-90deg), slides left, and fades out to 0 opacity.
    */
    .book-0 {
      animation-name: domino-book-0;
    }

    @keyframes domino-book-0 {
      0% {
        transform: translate(96px, 30px) rotate(-65deg);
        opacity: 1;
      }
      /* Tips over into flat position (-90deg on the shelf) */
      28% {
        transform: translate(84px, 30px) rotate(-90deg);
        opacity: 0.95;
      }
      /* Slides slightly left and fades out */
      55% {
        transform: translate(52px, 30px) rotate(-90deg);
        opacity: 0;
      }
      100% {
        transform: translate(52px, 30px) rotate(-90deg);
        opacity: 0;
      }
    }

    /* 
      BOOK 1:
      Starts tilted at -50deg.
      Tips over to -65deg while shifting leftwards into position 0.
    */
    .book-1 {
      animation-name: domino-book-1;
    }

    @keyframes domino-book-1 {
      0% {
        transform: translate(128px, 30px) rotate(-50deg);
        opacity: 1;
      }
      15% {
        transform: translate(128px, 30px) rotate(-50deg);
      }
      50% {
        transform: translate(110px, 30px) rotate(-60deg);
      }
      80%, 100% {
        transform: translate(96px, 30px) rotate(-65deg);
        opacity: 1;
      }
    }

    /* 
      BOOK 2:
      Starts tilted at -35deg.
      Tips over to -50deg while shifting leftwards into position 1.
    */
    .book-2 {
      animation-name: domino-book-2;
    }

    @keyframes domino-book-2 {
      0% {
        transform: translate(160px, 30px) rotate(-35deg);
        opacity: 1;
      }
      22% {
        transform: translate(160px, 30px) rotate(-35deg);
      }
      56% {
        transform: translate(142px, 30px) rotate(-44deg);
      }
      84%, 100% {
        transform: translate(128px, 30px) rotate(-50deg);
        opacity: 1;
      }
    }

    /* 
      BOOK 3:
      Starts tilted at -20deg.
      Tips over to -35deg while shifting leftwards into position 2.
    */
    .book-3 {
      animation-name: domino-book-3;
    }

    @keyframes domino-book-3 {
      0% {
        transform: translate(192px, 30px) rotate(-20deg);
        opacity: 1;
      }
      30% {
        transform: translate(192px, 30px) rotate(-20deg);
      }
      62% {
        transform: translate(174px, 30px) rotate(-28deg);
      }
      88%, 100% {
        transform: translate(160px, 30px) rotate(-35deg);
        opacity: 1;
      }
    }

    /* 
      BOOK 4:
      Starts completely upright at 0deg.
      Tips over to -20deg while shifting leftwards into position 3.
    */
    .book-4 {
      animation-name: domino-book-4;
    }

    @keyframes domino-book-4 {
      0% {
        transform: translate(224px, 30px) rotate(0deg);
        opacity: 1;
      }
      38% {
        transform: translate(224px, 30px) rotate(0deg);
      }
      70% {
        transform: translate(206px, 30px) rotate(-12deg);
      }
      92%, 100% {
        transform: translate(192px, 30px) rotate(-20deg);
        opacity: 1;
      }
    }

    /* 
      BOOK 5 (New incoming book on the right):
      Starts at low opacity (~0.2-0.3) at the far right.
      Fades in to solid white (1.0), sliding smoothly into position 4 upright (0deg).
    */
    .book-5 {
      animation-name: domino-book-5;
    }

    @keyframes domino-book-5 {
      0% {
        transform: translate(248px, 30px) rotate(0deg);
        opacity: 0;
      }
      18% {
        transform: translate(242px, 30px) rotate(0deg);
        opacity: 0.35;
      }
      50% {
        transform: translate(232px, 30px) rotate(0deg);
        opacity: 0.75;
      }
      80%, 100% {
        transform: translate(224px, 30px) rotate(0deg);
        opacity: 1;
      }
    }

    /* ==========================================================================
       CAPTION (Optional, toggled with .show-caption class on container)
       ========================================================================== */
    .caption {
      margin-top: 26px;
      width: 100%;
      max-width: 280px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      opacity: 0.95;
    }

    .caption-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #FFFFFF;
      text-transform: none;
    }

    .caption-author {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.2px;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 2px;
    }

    /* Toggle behavior */
    .loader-stage:not(.show-caption) .caption {
      display: none;
    }

    /* ==========================================================================
       ACCESSIBILITY / REDUCED MOTION
       ========================================================================== */
    @media (prefers-reduced-motion: reduce) {
      .book {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- 
    Container for the Bookshelf Loader.
    Add or remove 'show-caption' class to toggle the bottom caption.
  -->
  <div class="loader-stage show-caption" id="bookshelfLoader">
    <svg 
      class="bookshelf-svg" 
      viewBox="0 0 320 180" 
      fill="none" 
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-label="Bookshelf domino loading animation"
    >
      <!-- Definitions for reusable book spine motifs -->
      <defs>
        <!-- Reusable book outer rounded rectangle (28px wide, 100px tall) -->
        <rect id="book-body" x="0" y="0" width="28" height="100" rx="3" class="blueprint-stroke" />
      </defs>

      <!-- 1. The Shelf Line (~260px wide, 3px stroke, white) -->
      <line x1="30" y1="130" x2="290" y2="130" class="shelf-line" />

      <!-- 2. Faint Dotted Shadow directly below the shelf line (~40% opacity) -->
      <line x1="34" y1="137" x2="286" y2="137" class="shelf-dots" />

      <!-- 3. The Books Layer (Falling domino chain towards left) -->
      <g class="books-layer">
        
        <!-- Book 0: Far-left book (tips flat to -90deg, slides left & fades out) -->
        <g class="book book-0" id="book0">
          <use href="#book-body" />
          <!-- Spine detail: two top horizontal bands, two bottom horizontal bands -->
          <line x1="5" y1="16" x2="23" y2="16" class="spine-detail" />
          <line x1="5" y1="23" x2="23" y2="23" class="spine-detail" />
          <line x1="5" y1="76" x2="23" y2="76" class="spine-detail" />
          <line x1="5" y1="83" x2="23" y2="83" class="spine-detail" />
        </g>

        <!-- Book 1: Starting at -50deg tilt -->
        <g class="book book-1" id="book1">
          <use href="#book-body" />
          <!-- Spine detail: top band + small circle dot near bottom -->
          <line x1="5" y1="18" x2="23" y2="18" class="spine-detail" />
          <circle cx="14" cy="78" r="4.5" class="spine-detail" />
        </g>

        <!-- Book 2: Starting at -35deg tilt -->
        <g class="book book-2" id="book2">
          <use href="#book-body" />
          <!-- Spine detail: three evenly spaced horizontal bands -->
          <line x1="5" y1="20" x2="23" y2="20" class="spine-detail" />
          <line x1="5" y1="50" x2="23" y2="50" class="spine-detail" />
          <line x1="5" y1="80" x2="23" y2="80" class="spine-detail" />
        </g>

        <!-- Book 3: Starting at -20deg tilt -->
        <g class="book book-3" id="book3">
          <use href="#book-body" />
          <!-- Spine detail: two bands top, dot at bottom -->
          <line x1="5" y1="16" x2="23" y2="16" class="spine-detail" />
          <line x1="5" y1="23" x2="23" y2="23" class="spine-detail" />
          <circle cx="14" cy="80" r="4" class="spine-detail" />
        </g>

        <!-- Book 4: Starting upright (0deg) -->
        <g class="book book-4" id="book4">
          <use href="#book-body" />
          <!-- Spine detail: small circle top, two bands bottom -->
          <circle cx="14" cy="22" r="4.5" class="spine-detail" />
          <line x1="5" y1="76" x2="23" y2="76" class="spine-detail" />
          <line x1="5" y1="83" x2="23" y2="83" class="spine-detail" />
        </g>

        <!-- Book 5: Incoming book on the right (fades in upright at 0deg) -->
        <g class="book book-5" id="book5">
          <use href="#book-body" />
          <!-- Spine detail: two top horizontal bands, two bottom horizontal bands -->
          <line x1="5" y1="16" x2="23" y2="16" class="spine-detail" />
          <line x1="5" y1="23" x2="23" y2="23" class="spine-detail" />
          <line x1="5" y1="76" x2="23" y2="76" class="spine-detail" />
          <line x1="5" y1="83" x2="23" y2="83" class="spine-detail" />
        </g>

      </g>
    </svg>

    <!-- Optional blueprint caption -->
    <div class="caption">
      <div class="caption-title">#13 Bookshelf Loader</div>
      <div class="caption-author">by Grélard Antoine</div>
    </div>
  </div>

  <script>
    // Tiny helper: Click anywhere to toggle caption on/off
    document.addEventListener('click', () => {
      document.getElementById('bookshelfLoader').classList.toggle('show-caption');
    });
  </script>
</body>
</html>
